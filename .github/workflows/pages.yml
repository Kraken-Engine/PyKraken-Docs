name: Build and deploy documentation
on:
  workflow_dispatch:
    inputs:
      base_path:
        description: 'URL base: / for a custom domain, /repository-name for GitHub project pages'
        default: '/'
        required: true
      site_url:
        description: 'Canonical site origin'
        default: 'https://krakenengine.org'
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: pnpm build
        env:
          BASE_PATH: ${{ inputs.base_path }}
          SITE_URL: ${{ inputs.site_url }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
